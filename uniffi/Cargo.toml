[workspace]

members = [
    "clash-android-ffi",
    "uniffi-bindgen",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
uniffi = { version = "0.31", features = ["tokio"] }
async-compat = "0.2.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Referenced by core/build.gradle.kts ("release-dbg"): a release build that keeps
# line tables so Rust panics produce symbolicated backtraces in logcat.
[profile.release-dbg]
inherits = "release"
strip = "none"
debug = "line-tables-only"

[profile.detailed-release]
inherits = "release"
opt-level = 1
lto = "thin"

strip = "none"
debug = "line-tables-only"
split-debuginfo = "off"
panic = "unwind"

incremental = true
codegen-units = 256

[profile.dev]
opt-level = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev.package.backtrace]
opt-level = 3

[patch.crates-io]
async-compat = { git = "https://github.com/element-hq/async-compat", rev = "5a27c8b290f1f1dcfc0c4ec22c464e38528aa591" }
rustls = { git = "https://github.com/Watfaq/rustls.git", branch = "watfaq/0.23.40" }
tokio-rustls = { git = "https://github.com/Watfaq/tokio-rustls.git", branch = "watfaq/0.26.4" }