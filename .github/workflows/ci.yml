name: CI Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  RUSTC_BOOTSTRAP: "1"
  SCCACHE_GHA_ENABLED: "true"
  AWS_LC_SYS_PREBUILT_NASM: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: true
      
      - name: Set up JDK 25
        uses: actions/setup-java@v6.3.0
        with:
          distribution: 'temurin'
          java-version: '25'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
      
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android NDK
        run: |
          revision=$(sed -n 's/^clashNdkVersion=//p' gradle.properties)
          : "${revision:?Missing clashNdkVersion in gradle.properties}"
          ndk="$ANDROID_HOME/ndk/$revision"
          if [[ ! -f "$ndk/source.properties" ]]; then
            sdkmanager "ndk;$revision"
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"

      - name: Setup sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: taiki-e/install-action@v2.90.5
        with:
          tool: cargo-ndk,just

      - name: Identify binding generator inputs
        id: generator
        run: |
          echo "sources=$(git rev-parse HEAD:uniffi)" >> "$GITHUB_OUTPUT"
          echo "transfer=$(git rev-parse HEAD:localsend)" >> "$GITHUB_OUTPUT"
          echo "cargo-ndk=$(cargo ndk --version)" >> "$GITHUB_OUTPUT"

      - name: Cache generated Kotlin bindings
        id: bindings
        uses: actions/cache@v6.1.0
        with:
          path: core/src/main/java/uniffi
          key: bindings-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.cachekey }}-${{ steps.generator.outputs.cargo-ndk }}-${{ steps.generator.outputs.sources }}-${{ steps.generator.outputs.transfer }}-${{ hashFiles('.cargo/**', 'justfile', 'gradle.properties', '.github/workflows/ci.yml') }}

      - name: Generate Rust bindings
        if: steps.bindings.outputs.cache-hit != 'true'
        env:
          RUSTC_WRAPPER: sccache
        run: just generate-bindings --locked

      - name: Decode Keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
      
      - name: Get version info
        if: github.event_name != 'pull_request'
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        run: |
          ./gradlew --build-cache app:assembleDebug

      - name: Build Release APKs
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_SPLIT_ABI_ENABLE: true
          ANDROID_SPLIT_ABI_UNIVERSAL_APK: true
          FIREBASE_RELEASE_JSON: ${{ secrets.FIREBASE_RELEASE_GOOGLE_SERVICES_JSON }}
        run: |
          rm -rf app/build/outputs/apk
          : "${FIREBASE_RELEASE_JSON:?Set FIREBASE_RELEASE_GOOGLE_SERVICES_JSON to the production Android app configuration}"
          mkdir -p app/src/release
          printf '%s' "$FIREBASE_RELEASE_JSON" > app/src/release/google-services.json
          ./gradlew --build-cache -PuploadFirebaseMapping=true app:assembleRelease

          ./gradlew :app:generateCrashlyticsSymbolFileRelease
          # Check the actual APK against the unstripped Cargo outputs before uploading symbols.
          bash .github/verify-native-symbols.sh release
          ./gradlew :app:uploadCrashlyticsSymbolFileRelease

      - name: Archive matching native symbols and R8 mapping
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: crash-symbols-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            core/build/rustJniLibs/android/*/libclash_android_ffi.so
            core/build/profileTransferJni/*/libprofile_transfer.so
            app/build/outputs/mapping/release/mapping.txt
            build/native-symbols-release.txt
          if-no-files-found: error

      - name: Organize APKs
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p output
          VERSION="${{ steps.version.outputs.version }}"
          
          # Copy and rename APKs
          cp app/build/outputs/apk/release/*-arm64-v8a-release.apk output/clash-android-${VERSION}-arm64-v8a.apk || true
          cp app/build/outputs/apk/release/*-armeabi-v7a-release.apk output/clash-android-${VERSION}-armeabi-v7a.apk || true
          cp app/build/outputs/apk/release/*-x86-release.apk output/clash-android-${VERSION}-x86.apk || true
          cp app/build/outputs/apk/release/*-x86_64-release.apk output/clash-android-${VERSION}-x86_64.apk || true
          cp app/build/outputs/apk/release/*-universal-release.apk output/clash-android-${VERSION}-all.apk || true
          
          ls -lh output/

      - name: Create and publish release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        run: |
          # Delete old latest release if creating a new latest release
          if [ "$TAG_NAME" = "latest" ]; then
            gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          fi
          
          # Create draft release with changelog
          if [[ "$TAG_NAME" == v* ]]; then
            gh release create "$TAG_NAME" --draft --latest --title "$TAG_NAME"
          else
            gh release create "$TAG_NAME" --draft --title "测试构建"
          fi
          
          # Upload all package files
          find ./output -type f -exec gh release upload "$TAG_NAME" {} \;
          
          # Upload LICENSE file
          gh release upload "$TAG_NAME" LICENSE
          
      - name: Determine commit range for changelog
        if: github.event_name != 'pull_request'
        id: commit-range
        run: |
          # Check if this is a release (v* tag) or prerelease (push to main)
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            # For release: use previous v tag to current v tag
            CURRENT_TAG="${GITHUB_REF#refs/tags/}"
            # Get the previous v* tag (use -F -x for fixed string exact matching)
            PREVIOUS_TAG=$(git tag -l "v*" --sort=-version:refname | grep -F -x -v "${CURRENT_TAG}" | head -n 1)
            
            if [ -z "$PREVIOUS_TAG" ]; then
              # No previous tag found, use all commits up to current tag
              echo "args=${CURRENT_TAG}" >> $GITHUB_OUTPUT
            else
              echo "args=${PREVIOUS_TAG}..${CURRENT_TAG}" >> $GITHUB_OUTPUT
            fi
          else
            # For prerelease: use most recent v* tag to current commit
            LATEST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)
            
            if [ -z "$LATEST_TAG" ]; then
              # No v* tag found, use all commits up to HEAD
              echo "args=HEAD" >> $GITHUB_OUTPUT
            else
              echo "args=${LATEST_TAG}..HEAD" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Generate a changelog
        if: github.event_name != 'pull_request'
        uses: orhun/git-cliff-action@v4.9.1
        id: git-cliff
        with:
          config: .github/cliff.toml
          args: ${{ steps.commit-range.outputs.args }} --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}
          OUTPUT: CHANGELOG.md

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
        run: |
          # Publish the release (change from draft to published)
          if [[ "$TAG_NAME" == v* ]]; then
            gh release edit "$TAG_NAME" --draft=false --latest --notes-file CHANGELOG.md
          else
            gh release edit "$TAG_NAME" --draft=false --prerelease --notes-file CHANGELOG.md
          fi




